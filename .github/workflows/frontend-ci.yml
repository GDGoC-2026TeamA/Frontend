name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --experimental-vm-modules --test checks/*.test.mjs
      - run: npm run build
        env:
          VITE_DATA_MODE: api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_DATA_MODE: demo
          VITE_AUTH_RESET_REQUEST_PATH: ''
          VITE_AUTH_KAKAO_START_URL: ''
          VITE_AUTH_GOOGLE_START_URL: ''
      - name: Preserve failed Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
